[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jarvis"
version = "0.1.0"
description = "A planning brain for browser automation using browser-use"
authors = [{name = "Jarvis", email = "jarvis@example.com"}]
requires-python = ">=3.12"
dependencies = [
    "mcp==2.1.1",
]

[project.optional-dependencies]
dev = [
    "anthropic>=1.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["jarvis"]
